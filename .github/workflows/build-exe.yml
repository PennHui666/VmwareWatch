# 在线编译：push 到 main（或手动触发）时在 windows-latest 用 MSVC 编出 VmwareWatch.exe；
# 编完上传到该次运行的 Artifacts；如果是打标签推送（v*），额外发布一个 GitHub Release 并挂上 exe。
#
# 说明：
#   - 不写死 Visual Studio 安装路径（各镜像里 Enterprise/Community/Professional 都出现过）；
#   - 用 ilammy/msvc-dev-cmd 自动定位并注入 MSVC 环境变量，之后直接可用 cl。

name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write        # 发布 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译
        shell: cmd
        run: |
          cl /O2 /MT /utf-8 /DUNICODE /D_UNICODE /W3 vmware_watch.c /Fe:VmwareWatch.exe /link advapi32.lib shell32.lib user32.lib shlwapi.lib

      - name: 检查产物
        shell: cmd
        run: |
          if not exist VmwareWatch.exe (echo 产物不存在 & exit /b 1)
          dir VmwareWatch.exe

      - name: 上传到运行产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: VmwareWatch-exe
          path: VmwareWatch.exe

      - name: 发布 Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VmwareWatch.exe
          generate_release_notes: true
