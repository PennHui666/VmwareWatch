# 在线编译：推到 GitHub 后，Actions 在 windows-latest 虚拟机里用 MSVC 编出 exe，
# 编译完在该次运行的 Artifacts 里下载 VmwareWatch.exe。
#
# 用法：
#   1. 仓库 Actions 标签页手动触发（或 push 到 main 自动跑）；
#   2. 运行结束 -> Artifacts -> VmwareWatch-exe 下载。
#
# 说明：
#   - 不写死 Visual Studio 安装路径（各镜像里 Enterprise/Community/Professional 都出现过）；
#   - 用 ilammy/msvc-dev-cmd 自动定位并注入 MSVC 环境变量，之后直接可用 cl。

name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认编译器可用
        shell: cmd
        run: |
          where cl
          cl 2>&1 | findstr /C:"Microsoft (R)"

      - name: 编译
        shell: cmd
        run: |
          cl /O2 /MT /DUNICODE /D_UNICODE /W3 vmware_watch.c /Fe:VmwareWatch.exe /link comctl32.lib advapi32.lib shell32.lib user32.lib shlwapi.lib /manifestdependency:"type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'"

      - name: 检查产物
        shell: cmd
        run: |
          if not exist VmwareWatch.exe (echo 产物不存在 & exit /b 1)
          dir VmwareWatch.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: VmwareWatch-exe
          path: VmwareWatch.exe
